<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101d28"><title>Trip Percent</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><main><section class="calculator"><h2>Scheduled trip time</h2><div class="timeInputs"><div><label for="minutes">Minutes</label><div class="inputWrap"><input id="minutes" type="text" inputmode="numeric" min="5" max="70" step="1" value="50"><span>min</span></div></div><div><label for="seconds">Seconds</label><div class="inputWrap"><input id="seconds" type="text" inputmode="numeric" min="0" max="59" step="1" value="0"><span>sec</span></div></div></div><p id="error" role="status"></p><div class="dialHeading"><h2>Your percentage</h2><button id="reset" class="reset">Reset to 100%</button></div><div class="wheelFrame"><div class="selectionBand"></div><div id="wheel" class="wheel" tabindex="0" role="slider" aria-label="Trip percentage; scroll or use arrow keys" aria-valuemin="5" aria-valuemax="500" aria-valuenow="100"></div><div class="wheelPointer">◂</div></div><div class="precise"><label for="percent">Or enter a percentage</label><input id="percent" type="number" min="5" max="500" step="5" inputmode="decimal" value="100"><span>%</span></div><p id="percentError" role="status"></p><div class="result" aria-live="polite" aria-atomic="true"><div class="eyebrow" id="resultLabel">TRIP TIME AT 100%</div><div class="big" id="result">50:00</div><p id="detail">50 minutes, 0 seconds</p><p class="rounding" id="rounding">Time rounded to the nearest second.</p></div></section></main><script src="app.js"></script></body></html>
